<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1025"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="cookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba68c8"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Browser window -->
  <rect x="70" y="60" width="260" height="200" rx="12" fill="#1e1e30" stroke="#9c27b0" stroke-width="2"/>
  <rect x="70" y="60" width="260" height="35" rx="12" fill="#2a2a40"/>
  <rect x="70" y="83" width="260" height="12" fill="#2a2a40"/>
  <circle cx="92" cy="78" r="6" fill="#ff5f56"/>
  <circle cx="112" cy="78" r="6" fill="#ffbd2e"/>
  <circle cx="132" cy="78" r="6" fill="#27c93f"/>
  <rect x="155" y="72" width="150" height="12" rx="6" fill="#3a3a55"/>
  <!-- Cookie icon -->
  <circle cx="200" cy="175" r="50" fill="url(#cookie)"/>
  <circle cx="185" cy="160" r="8" fill="#e65100"/>
  <circle cx="215" cy="155" r="6" fill="#e65100"/>
  <circle cx="195" cy="185" r="7" fill="#e65100"/>
  <circle cx="220" cy="180" r="5" fill="#e65100"/>
  <!-- Bite taken out -->
  <circle cx="240" cy="155" r="18" fill="url(#bg)"/>
  <!-- Stealing hand/claw -->
  <g transform="translate(260, 130) rotate(15)">
    <path d="M0,0 C10,-20 30,-25 35,-5 L30,10 C25,5 15,5 10,10 Z" fill="url(#purple)" opacity="0.9"/>
    <path d="M10,10 C15,-5 25,-8 30,10 L25,25 C20,15 15,18 10,10 Z" fill="url(#purple)" opacity="0.9"/>
    <path d="M-5,15 C5,-5 15,-5 20,15 L15,30 C10,20 5,22 -5,15 Z" fill="url(#purple)" opacity="0.9"/>
  </g>
  <!-- Data stream particles -->
  <circle cx="280" cy="120" r="3" fill="#9c27b0" opacity="0.8"/>
  <circle cx="295" cy="105" r="2" fill="#ff9800" opacity="0.6"/>
  <circle cx="310" cy="95" r="3" fill="#9c27b0" opacity="0.5"/>
  <circle cx="290" cy="135" r="2" fill="#ff9800" opacity="0.7"/>
  <!-- Text -->
  <text x="200" y="310" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="bold" fill="#ff9800">Cookie</text>
  <text x="200" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="bold" fill="#9c27b0">Stealer</text>
  <!-- Subtle glow -->
  <circle cx="200" cy="175" r="55" fill="none" stroke="#ff9800" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="175" r="65" fill="none" stroke="#9c27b0" stroke-width="0.5" opacity="0.2"/>
</svg>